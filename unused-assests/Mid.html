<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eidan Digital Agency | Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #1a0f00;
            --text-gold: #f4d0a5;
            --accent-yellow: #ffb800;
        }

        body, html {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            color: var(--text-gold);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
        }

        /* Spacer to allow for scrolling effect */
        .spacer {
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            letter-spacing: 5px;
            opacity: 0.3;
        }

        /* Main Section Container */
        .hero-section {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 80px 10%;
            box-sizing: border-box;
            background: 
                url('./Gemini_Generated_Image_uk34esuk34esuk34.png') center/cover;
            border-top: 1px solid rgba(244, 208, 165, 0.2);
            border-bottom: 1px solid rgba(244, 208, 165, 0.2);
        }

        /* Floating Sunflower Asset */
        .floating-sunflower {
            position: absolute;
            right: 5%;
            bottom: -50px;
            width: 350px;
            height: auto;
            z-index: 10;
            pointer-events: none;
            transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
            filter: drop-shadow(0 20px 50px rgba(0,0,0,0.5));
            transform: rotate(20deg) translateY(100px); /* Initial hidden state */
        }

        .floating-sunflower.active {
            transform: rotate(-10deg) translateY(0);
        }

        /* Layout Grid */
        .content-grid {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 100px;
            z-index: 5;
            width: 100%;
            max-width: 1400px;
        }

        /* Left Column: The Story */
        .story-col h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 40px;
            opacity: 0.7;
        }

        .main-text {
            font-size: clamp(2rem, 4vw, 3.5rem);
            line-height: 1.2;
            font-weight: 400;
            color: #fff;
        }

        .main-text span {
            color: var(--text-gold);
            font-style: italic;
        }

        /* Right Column: Services */
        .services-col {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .services-col h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 30px;
            opacity: 0.7;
        }

        .service-item {
            border-top: 1px solid rgba(244, 208, 165, 0.3);
            padding: 25px 0;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .service-item:hover {
            color: var(--accent-yellow);
            padding-left: 10px;
        }

        .service-item::after {
            content: '→';
            font-size: 1rem;
            opacity: 0;
            transition: 0.3s;
        }

        .service-item:hover::after {
            opacity: 1;
        }

        /* Shopping Cart Floating Icon */
        .cart-icon {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 50%;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            z-index: 20;
        }

        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; gap: 50px; }
            .floating-sunflower { width: 200px; opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="spacer">Scroll down to see the magic</div>

    <section class="hero-section" id="agency-section">
        <img src="image-Photoroom (1).png" 
             alt="Sunflower" 
             class="floating-sunflower" 
             id="sunflower-asset">

        <div class="content-grid">
            <div class="story-col">
                <h3>The Story</h3>
                <p class="main-text">
                    <b>Eidan</b> is a digital agency that offers a 
                    <span>wide scale of creative services</span>, 
                    including brand development, online marketing and lots more.
                </p>
            </div>

            <div class="services-col">
                <h3>Our Service</h3>
                <div class="service-item">User Experience Design</div>
                <div class="service-item">User Interface Design</div>
                <div class="service-item">Digital Prototypes</div>
                <div class="service-item">Front-end and CMS</div>
            </div>
        </div>

        <div class="cart-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
        </div>
    </section>

    <div class="spacer">Keep scrolling for more</div>

    <script>
        // Intersection Observer for the Entrance Animation
        const observerOptions = {
            threshold: 0.2 // Trigger when 20% of the section is visible
        };

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const sunflower = document.getElementById('sunflower-asset');
                if (entry.isIntersecting) {
                    sunflower.classList.add('active');
                } else {
                    sunflower.classList.remove('active');
                }
            });
        }, observerOptions);

        observer.observe(document.getElementById('agency-section'));

        // Real-time Scroll Tiling Effect (Subtle Movement)
        window.addEventListener('scroll', () => {
            const sunflower = document.getElementById('sunflower-asset');
            const scrolled = window.pageYOffset;
            const section = document.getElementById('agency-section');
            const sectionTop = section.offsetTop;
            
            // Only calculate if we are near the section
            if (scrolled > sectionTop - window.innerHeight && scrolled < sectionTop + section.offsetHeight) {
                const relativeScroll = scrolled - sectionTop;
                // Gently tilt and move based on scroll position
                const tilt = (relativeScroll * 0.05) - 10;
                const yMove = (relativeScroll * 0.1);
                
                sunflower.style.transform = `rotate(${tilt}deg) translateY(${yMove}px)`;
            }
        });
    </script>
</body>
</html>
